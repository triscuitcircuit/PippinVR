repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '.*\.(md|swift|cpp|h)$'
      - id: end-of-file-fixer
        exclude: '.*\.(png|jpg|jpeg|icns|iconset)$'
      - id: check-yaml
        exclude: ".*android.*"
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/realm/SwiftLint
    rev: 0.54.0
    hooks:
      - id: swiftlint
        name: SwiftLint
        entry: swiftlint
        language: system
        files: \.swift$
        args: ["--fix", "--config", "pippinVR-Server/.swiftlint.yml"]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v17.0.6
    hooks:
      - id: clang-format
        name: clang-format
        types_or: [c++, c]
        files: \.(cpp|cc|cxx|c|h|hpp|hxx)$
        args: ["-i", "--style=file:pippinVR-client/.clang-format"]
        exclude: "^pippinVR-client/app/src/main/cpp/(android_native_app_glue|openxr)/"


  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: ["-x"]

  - repo: local
    hooks:
      - id: swift-debug-check
        name: Check for Swift debug prints
        entry: 'grep -rn "print(" pippinVR-Server/Sources/ || exit 0; exit 1'
        language: system
        pass_filenames: false
        stages: [manual]

      - id: check-todos
        name: Check for TODO/FIXME
        entry: bash -c 'git diff --cached --name-only | xargs grep -HEn "TODO|FIXME" || exit 0; echo "Found TODO/FIXME in staged files"; exit 1'
        language: system
        pass_filenames: false
        stages: [manual]

      - id: swift-build-check
        name: Swift build check
        entry: bash -c 'cd pippinVR-Server && swift build -c release'
        language: system
        pass_filenames: false
        stages: [manual]
