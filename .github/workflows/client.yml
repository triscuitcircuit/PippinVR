name: Client

on:
  push:
    branches: [ "main", "core-connection" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - 'pippinVR-client/**'
      - '.github/workflows/client.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quest APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install NDK & CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Install NDK & CMake
        run: sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: pippinVR-client

      - name: Build debug APK
        working-directory: pippinVR-client
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pippinvr-client-apk
          path: pippinVR-client/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: github.ref_name == 'main' || github.ref_name == 'core-connection' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.ref_name) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build ({0})', github.ref_name) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: pippinVR-client/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-submission:
    name: Dependency graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4
        with:
          build-root-directory: pippinVR-client
